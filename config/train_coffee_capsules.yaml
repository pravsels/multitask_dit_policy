dataset_path: villekuosmanen/bin_pick_pack_coffee_capsules
run_name: coffee_capsules_bs320_lr3e4_v1

dataset_schema:
  state:
    - key: observation.state.pos
      dim: 7
    - key: observation.state.eef_pose
      dim: 7
      convert_rotation: true
  action:
    - key: action.pos
      dim: 7
    - key: action.eef_pose
      dim: 7
      convert_rotation: true
  rot6d_slice: [10, 16]

batch_size: 80
num_workers: 24
prefetch_factor: 1
train_steps: 50000
save_freq: 5000
keep_freq: 10000
log_freq: 100
use_amp: true
lr_scheduler: cosine
lr_warmup_steps: 500
lr_scheduler_min_lr_scale: 0.1

policy:
  n_obs_steps: 2
  horizon: 32
  n_action_steps: 32
  drop_n_last_frames: 0
  do_mask_loss_for_padding: true
  optimizer_lr: 3.0e-4
  optimizer_betas: [0.95, 0.999]
  optimizer_eps: 1.0e-8
  optimizer_weight_decay: 0.0
  objective:
    type: diffusion
    noise_scheduler_type: DDIM
    num_train_timesteps: 100
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    beta_end: 0.02
    prediction_type: epsilon
    clip_sample: true
    clip_sample_range: 1.0
    num_inference_steps: 20
  observation_encoder:
    text:
      type: clip
      model: openai/clip-vit-base-patch16
    vision:
      type: clip
      backbone: vit_base_patch16_clip_224.openai
      crop_shape: null
      resize_shape: [224, 224]
      lr_multiplier: 0.1
      crop_is_random: false
      use_separate_encoder_per_camera: true
